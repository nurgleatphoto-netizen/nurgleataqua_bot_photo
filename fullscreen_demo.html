<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Aquascape fullscreen demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app {
      position: relative;
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: pan-y;
    }

    img.main-image {
      max-width: 100%;
      max-height: 100%;
      display: block;
      margin: 0 auto;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: rgba(0, 0, 0, 0.4);
      padding: 12px 16px;
      font-size: 20px;
      border-radius: 999px;
      cursor: pointer;
      color: #fff;
      user-select: none;
      touch-action: manipulation;
    }

    .nav-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .nav-prev { left: 8px; }
    .nav-next { right: 8px; }

    .footer {
      padding: 8px 12px 12px;
      text-align: center;
      font-size: 14px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0));
    }

    .counter { font-variant-numeric: tabular-nums; }
    .caption { opacity: .8; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <button class="nav-btn nav-prev" id="btnPrev">&#10094;</button>
    <img id="mainImage" class="main-image" src="" alt="Aquascape image">
    <button class="nav-btn nav-next" id="btnNext">&#10095;</button>
  </div>

  <div class="footer">
    <div class="counter" id="counter"></div>
    <div class="caption" id="caption"></div>
  </div>

  <script>
    const images = [
      {
        url: "https://nurgleatphoto-netizen.github.io/nurgleataqua_bot_photo/images/001.jpg",
        caption: "Фото 1"
      },
      {
        url: "https://nurgleatphoto-netizen.github.io/nurgleataqua_bot_photo/images/002.jpg",
        caption: "Фото 2"
      },
      {
        url: "https://nurgleatphoto-netizen.github.io/nurgleataqua_bot_photo/images/003.jpg",
        caption: "Фото 3"
      }
    ];

    let current = 0;

    const imgEl = document.getElementById("mainImage");
    const counterEl = document.getElementById("counter");
    const captionEl = document.getElementById("caption");
    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const appEl = document.getElementById("app");

    function showImage(index) {
      const total = images.length;
      if (total === 0) return;
      current = (index + total) % total;
      const item = images[current];
      imgEl.src = item.url;
      counterEl.textContent = (current + 1) + " / " + total;
      captionEl.textContent = item.caption || "";
    }

    function showNext() { showImage(current + 1); }
    function showPrev() { showImage(current - 1); }

    btnNext.addEventListener("click", showNext);
    btnPrev.addEventListener("click", showPrev);

    // Простейшие свайпы влево/вправо
    let touchStartX = 0;
    const SWIPE_THRESHOLD = 40;

    appEl.addEventListener("touchstart", function (e) {
      if (!e.touches || e.touches.length === 0) return;
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    appEl.addEventListener("touchend", function (e) {
      if (!e.changedTouches || e.changedTouches.length === 0) return;
      const touchEndX = e.changedTouches[0].clientX;
      const dx = touchEndX - touchStartX;
      if (Math.abs(dx) < SWIPE_THRESHOLD) return;
      if (dx < 0) {
        showNext();
      } else {
        showPrev();
      }
    });

    // Стрелки на клавиатуре — для десктопа
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") showNext();
      if (e.key === "ArrowLeft") showPrev();
    });

    showImage(0);
  </script>
</body>
</html>
