<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Aquascape fullscreen viewer</title>
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .viewer {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none; /* перехватываем жесты */
    }

    .image-wrapper {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .image-wrapper img {
      max-width: 100%;
      max-height: 100%;
      transform-origin: center center;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 14px;
      font-size: 22px;
      border-radius: 999px;
      cursor: pointer;
      color: #fff;
      user-select: none;
    }

    .nav-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .nav-prev {
      left: 10px;
    }

    .nav-next {
      right: 10px;
    }

    .footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 8px 12px 12px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0));
      font-size: 13px;
      text-align: center;
    }

    .counter {
      font-variant-numeric: tabular-nums;
      margin-bottom: 2px;
    }

    .caption {
      opacity: 0.85;
    }

    .source {
      margin-top: 4px;
      font-size: 11px;
      opacity: 0.7;
      line-height: 1.3;
    }
    
    .source a {
      color: inherit;
      text-decoration: underline;
    }
    

    .header {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      padding: 8px 12px 12px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0));
      font-size: 13px;
      text-align: center;
      opacity: 0.9;
    }

    .header span {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
<div class="viewer" id="viewer">
  <div class="image-wrapper">
    <img id="mainImage" src="" alt="Aquascape">
  </div>

  <button class="nav-btn nav-prev" id="btnPrev">&#10094;</button>
  <button class="nav-btn nav-next" id="btnNext">&#10095;</button>

  <div class="header">
    <span id="headerLabel"></span>
  </div>

  <div class="footer">
    <div class="counter" id="counter"></div>
    <div class="caption" id="caption"></div>
    <div class="source">
      Источник фото:
      <a href="https://aqualibs.com" target="_blank" rel="noopener noreferrer">aqualibs.com</a><br>
      Полезный и информативный источник информации по Nature Aquarium
    </div>
  </div>
</div>

<script>
  // ===== 1. ДАННЫЕ ГАЛЕРЕЙ =====
const GALLERY_CONFIG = {
  iaplc: {
    2025: {
      baseUrl: "https://aqualibs.com/images/contest/iaplc/2025/gallery",
      count: 300,
      label: "IAPLC 2025",
      ext: "jpg",
      pad: 3
    },
    2024: {
      baseUrl: "https://aqualibs.com/images/contest/iaplc/2024/gallery",
      count: 300,
      label: "IAPLC 2024",
      ext: "webp",
      pad: 3
    },
    2023: {
      baseUrl: "https://aqualibs.com/images/contest/iaplc/2023/gallery",
      count: 300,
      label: "IAPLC 2023",
      ext: "webp",
      pad: 3
    },
    2008: {
      baseUrl: "https://aqualibs.com/images/contest/iaplc/2008",
      count: 27,
      label: "IAPLC 2008",
      ext: "webp",
      pad: 0
    },
    2007: {
      baseUrl: "https://aqualibs.com/images/contest/iaplc/2007",
      count: 27,
      label: "IAPLC 2007",
      ext: "webp",
      pad: 0
    },
    2006: {
      baseUrl: "https://aqualibs.com/images/contest/iaplc/2006",
      count: 27,
      label: "IAPLC 2006",
      ext: "webp",
      pad: 0
    },
    2005: {
      baseUrl: "https://aqualibs.com/images/contest/iaplc/2005",
      count: 27,
      label: "IAPLC 2005",
      ext: "webp",
      pad: 0
    },
    2004: {
      baseUrl: "https://aqualibs.com/images/contest/iaplc/2004",
      count: 27,
      label: "IAPLC 2004",
      ext: "webp",
      pad: 0
    },
    2003: {
      baseUrl: "https://aqualibs.com/images/contest/iaplc/2003",
      count: 27,
      label: "IAPLC 2003",
      ext: "webp",
      pad: 0
    },
    2002: {
      baseUrl: "https://aqualibs.com/images/contest/iaplc/2002",
      count: 27,
      label: "IAPLC 2002",
      ext: "webp",
      pad: 0
    },
    2001: {
      baseUrl: "https://aqualibs.com/images/contest/iaplc/2001",
      count: 27,
      label: "IAPLC 2001",
      ext: "webp",
      pad: 0,
      // с 11-й работы идут файлы вида 11a.webp, 12a.webp и т.п.
      suffixFrom: 11,
      suffix: "a",
      // оверрайд для отсутствующих картинок
      overrides: {
        16: "https://raw.githubusercontent.com/krapivnikslab/repo_img/main/images/161c40a1f1ee02423391094e060a1c32b8.jpg",
        23: "https://raw.githubusercontent.com/krapivnikslab/repo_img/main/images/23161c40a1f1ee02423391094e060a1c32b8.jpg"
      }
    }
  },
  kiac: {
    2024: {
      label: "KIAC 2024 Top50",
      segments: [
        {
          from: 1,
          to: 10,
          baseUrl: "https://aqualibs.com/images/contest/kiac/2024/top10",
          ext: "webp",
          pad: 2, // 01.webp..10.webp
        },
        {
          from: 11,
          to: 30,
          baseUrl: "https://aqualibs.com/images/contest/kiac/2024/top30",
          ext: "webp",
          pad: 2, // 11.webp..30.webp
        },
        {
          from: 31,
          to: 50,
          baseUrl: "https://aqualibs.com/images/contest/kiac/2024/top50",
          ext: "webp",
          pad: 2, // 31.webp..50.webp
        },
      ],
    },
    2023: {
      label: "KIAC 2023 Top50",
      segments: [
        {
          from: 1,
          to: 10,
          baseUrl: "https://aqualibs.com/images/contest/kiac/2023/top10",
          ext: "webp",
          pad: 2, // 01.webp..10.webp
        },
        {
          from: 11,
          to: 30,
          baseUrl: "https://aqualibs.com/images/contest/kiac/2023/top30",
          ext: "webp",
          pad: 2, // 11.webp..30.webp
        },
        {
          from: 31,
          to: 50,
          baseUrl: "https://aqualibs.com/images/contest/kiac/2023/top50",
          ext: "webp",
          pad: 2, // 31.webp..50.webp
        },
      ],
    },
    2022: {
      baseUrl: "https://aqualibs.com/images/contest/kiac/2022",
      count: 50,
      label: "KIAC 2022 Top50",
      ext: "webp",
      pad: 2
    }
  }
};

  function parseQuery() {
    const params = new URLSearchParams(window.location.search);
    return {
      contest: (params.get("contest") || "iaplc").toLowerCase(),
      year: parseInt(params.get("year") || "2025", 10),
      idx: parseInt(params.get("idx") || "0", 10)
    };
  }

function getGallery(contest, year) {
  const contestCfg = GALLERY_CONFIG[contest];
  if (!contestCfg) return null;

  const cfg = contestCfg[year];
  if (!cfg) return null;

  // Вариант с сегментами (KIAC 2024/2023)
  if (Array.isArray(cfg.segments)) {
    const images = [];
    const label = cfg.label || `${contest.toUpperCase()} ${year}`;
    for (const seg of cfg.segments) {
      const ext = seg.ext || cfg.ext || "webp";
      const pad = typeof seg.pad === "number" ? seg.pad : 2;
      for (let n = seg.from; n <= seg.to; n++) {
        const numStr = pad > 0 ? String(n).padStart(pad, "0") : String(n);
        let url = `${seg.baseUrl}/${numStr}.${ext}`;
        // оверрайд для конкретных номеров (если задан в конфиге года)
        if (cfg.overrides && cfg.overrides[n]) {
          url = cfg.overrides[n];
        }
        images.push({
          url,
          caption: `${label} — №${n}`,
        });
      }
    }
    return images;
  }

  // Обычный вариант (IAPLC, KIAC 2022 и т.п.)
  const ext = cfg.ext || "jpg";
  const pad = typeof cfg.pad === "number" ? cfg.pad : 3;
  const suffixFrom = typeof cfg.suffixFrom === "number" ? cfg.suffixFrom : null;
  const suffix = typeof cfg.suffix === "string" ? cfg.suffix : "";
  const images = [];
  const label = cfg.label || `${contest.toUpperCase()} ${year}`;

  for (let i = 1; i <= cfg.count; i++) {
    const numStr = pad > 0 ? String(i).padStart(pad, "0") : String(i);
    const name = suffixFrom !== null && i >= suffixFrom ? numStr + suffix : numStr;
    let url = `${cfg.baseUrl}/${name}.${ext}`;
    // и тут тоже даем возможность переопределить URL
    if (cfg.overrides && cfg.overrides[i]) {
      url = cfg.overrides[i];
    }
    images.push({
      url,
      caption: `${label} — №${i}`,
    });
  }

  return images;
}






  // ===== 2. СОСТОЯНИЕ ВЬЮЕРА =====
  const viewer = document.getElementById("viewer");
  const imgEl = document.getElementById("mainImage");
  const counterEl = document.getElementById("counter");
  const captionEl = document.getElementById("caption");
  const headerLabelEl = document.getElementById("headerLabel");
  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");

  const params = parseQuery();
  const images = getGallery(params.contest, params.year) || [];
  let current = Math.min(Math.max(params.idx || 0, 0), Math.max(images.length - 1, 0));

  // масштаб и панорамирование
  let scale = 1;
  const MIN_SCALE = 1;
  const MAX_SCALE = 3;

  let offsetX = 0;
  let offsetY = 0;

  // жесты
  let swipeStartX = null;
  let swipeStartY = null;
  let pinchStartDistance = null;
  let pinchStartScale = 1;

  const SWIPE_THRESHOLD = 50; // px

  function setHeaderLabel() {
    headerLabelEl.textContent = params.contest.toUpperCase() + " " + params.year;
  }

  function applyTransform() {
    imgEl.style.transform = `translate3d(${offsetX}px, ${offsetY}px, 0) scale(${scale})`;
  }

  function resetTransform() {
    scale = 1;
    offsetX = 0;
    offsetY = 0;
    applyTransform();
  }

  function showImage(index) {
    if (!images.length) return;
    const total = images.length;
    current = (index + total) % total;
    const item = images[current];
    imgEl.src = item.url;
    counterEl.textContent = (current + 1) + " / " + total;
    captionEl.textContent = item.caption || "";
    resetTransform();
  }

  function showNext() {
    showImage(current + 1);
  }

  function showPrev() {
    showImage(current - 1);
  }

  function distanceBetweenTouches(t1, t2) {
    const dx = t2.clientX - t1.clientX;
    const dy = t2.clientY - t1.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // ===== 3. ОБРАБОТКА ЖЕСТОВ =====
  viewer.addEventListener("touchstart", function (e) {
    if (e.touches.length === 1) {
      swipeStartX = e.touches[0].clientX;
      swipeStartY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      pinchStartDistance = distanceBetweenTouches(e.touches[0], e.touches[1]);
      pinchStartScale = scale;
    }
  }, { passive: false });

  viewer.addEventListener("touchmove", function (e) {
    if (e.touches.length === 2) {
      // пинч-зуум
      e.preventDefault();
      const dist = distanceBetweenTouches(e.touches[0], e.touches[1]);
      if (pinchStartDistance) {
        const factor = dist / pinchStartDistance;
        scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, pinchStartScale * factor));
        applyTransform();
      }
    } else if (e.touches.length === 1 && scale > 1) {
      // панорамирование при увеличении
      e.preventDefault();
      const touch = e.touches[0];
      const dx = touch.clientX - swipeStartX;
      const dy = touch.clientY - swipeStartY;
      swipeStartX = touch.clientX;
      swipeStartY = touch.clientY;
      offsetX += dx;
      offsetY += dy;
      applyTransform();
    }
  }, { passive: false });

  viewer.addEventListener("touchend", function (e) {
    // если было 2 пальца, сбрасываем пинч
    if (e.touches.length < 2) {
      pinchStartDistance = null;
    }

    // свайп для листания — только если масштаб почти 1
    if (e.touches.length === 0 && swipeStartX !== null && scale <= 1.05) {
      const changed = e.changedTouches[0];
      const dx = changed.clientX - swipeStartX;
      if (dx > SWIPE_THRESHOLD) {
        showPrev();
      } else if (dx < -SWIPE_THRESHOLD) {
        showNext();
      }
    }

    if (e.touches.length === 0) {
      swipeStartX = null;
      swipeStartY = null;
    }
  });

  // стрелки на экране
  btnNext.addEventListener("click", showNext);
  btnPrev.addEventListener("click", showPrev);

  // стрелки на клавиатуре (для десктопа)
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") showNext();
    if (e.key === "ArrowLeft") showPrev();
  });

  // ===== 4. ИНИЦИАЛИЗАЦИЯ =====
  if (!images.length) {
    captionEl.textContent = "Галерея не найдена";
    counterEl.textContent = "";
    imgEl.style.display = "none";
  } else {
    setHeaderLabel();
    showImage(current);
  }
</script>
</body>
</html>
