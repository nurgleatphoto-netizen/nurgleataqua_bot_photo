<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Aquascape fullscreen viewer</title>
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .viewer {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none; /* перехватываем жесты */
    }

    .image-wrapper {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .image-wrapper img {
      max-width: 100%;
      max-height: 100%;
      transform-origin: center center;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 14px;
      font-size: 22px;
      border-radius: 999px;
      cursor: pointer;
      color: #fff;
      user-select: none;
    }

    .nav-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .nav-prev {
      left: 10px;
    }

    .nav-next {
      right: 10px;
    }

    .footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 8px 12px 12px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0));
      font-size: 13px;
      text-align: center;
    }

    .counter {
      font-variant-numeric: tabular-nums;
      margin-bottom: 2px;
    }

    .caption {
      opacity: 0.85;
    }

    .source {
      margin-top: 4px;
      font-size: 11px;
      opacity: 0.7;
      line-height: 1.3;
    }
    
    .source a {
      color: inherit;
      text-decoration: underline;
    }
    

    .header {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      padding: 8px 12px 12px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0));
      font-size: 13px;
      text-align: center;
      opacity: 0.9;
    }

    .header span {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.6);
    }

/* На мобильниках в альбомной ориентации прячем нижний текстовый блок */
@media (orientation: landscape) and (max-width: 900px) {
  .footer {
    display: none;
  }
  .header {
    display: none;
  }
}

    
  </style>
</head>
<body>
<div class="viewer" id="viewer">
  <div class="image-wrapper">
    <img id="mainImage" src="" alt="Aquascape">
  </div>

  <button class="nav-btn nav-prev" id="btnPrev">&#10094;</button>
  <button class="nav-btn nav-next" id="btnNext">&#10095;</button>

  <div class="header">
    <span id="headerLabel"></span>
  </div>

  <div class="footer">
    <div class="counter" id="counter"></div>
    <div class="caption" id="caption"></div>
    <div class="source">
      Источник фото:
      <a href="https://aqualibs.com" target="_blank" rel="noopener noreferrer">aqualibs.com</a><br>
      Полезный и информативный источник информации по Nature Aquarium
    </div>
  </div>
</div>

<script>

  kiac: {

        {

    2023: {

      segments: [
        {
          from: 1,

          ext: "webp",
          pad: 0, // 01.webp..10.webp
        },
        {
          from: 11,
          to: 30,
          baseUrl: "https://aqualibs.com/images/contest/kiac/2023/top30",

        },
        {
          from: 31,

          ext: "webp",
          pad: 0, // 31.webp..50.webp
        },
      ],
    },
    2022: {
      baseUrl: "https://aqualibs.com/images/contest/kiac/2022",
      count: 50,

};

function parseQuery() {
  const params = new URLSearchParams(window.location.search);
  return {
    contest: (params.get("contest") || "iaplc").toLowerCase(),
    year: parseInt(params.get("year") || "2025", 10),
    idx: parseInt(params.get("idx") || "0", 10)
  };
}

function getGallery(contest, year) {
  const contestCfg = GALLERY_CONFIG[contest];
  if (!contestCfg) return null;

  const cfg = contestCfg[year];
  if (!cfg) return null;

  // Вариант с сегментами (KIAC 2024/2023)
  if (Array.isArray(cfg.segments)) {
    const images = [];
    const label = cfg.label || `${contest.toUpperCase()} ${year}`;

    for (const seg of cfg.segments) {
      const ext = seg.ext || cfg.ext || "webp";
      const pad = typeof seg.pad === "number" ? seg.pad : 2;

      for (let n = seg.from; n <= seg.to; n++) {
        const numStr = pad > 0 ? String(n).padStart(pad, "0") : String(n);
        let url = `${seg.baseUrl}/${numStr}.${ext}`;

        // оверрайд для конкретных номеров (если задан в конфиге года)
        if (cfg.overrides && cfg.overrides[n]) {
          url = cfg.overrides[n];
        }

        images.push({
          url,
          caption: `${label} — №${n}`,
        });
      }
    }

    return images;
  }

  // Обычный вариант (IAPLC, KIAC 2022 и т.п.)
  const ext = cfg.ext || "jpg";
  const pad = typeof cfg.pad === "number" ? cfg.pad : 3;

  // "хвост" к числу — для 11a, 12a и т.п. (IAPLC 2001)
  const suffixFrom = typeof cfg.suffixFrom === "number" ? cfg.suffixFrom : null;
  const suffix = typeof cfg.suffix === "string" ? cfg.suffix : "";

  // шаблон имени файла, если нужен (IAPLC 2017 и т.п.)
  const pattern = typeof cfg.pattern === "string" ? cfg.pattern : null;

  // префикс/суффикс вокруг базового имени (IAPLC 2016 и др.)
  const namePrefix = typeof cfg.namePrefix === "string" ? cfg.namePrefix : "";
  const nameSuffix = typeof cfg.nameSuffix === "string" ? cfg.nameSuffix : "";

  const images = [];
  const label = cfg.label || `${contest.toUpperCase()} ${year}`;

  for (let i = 1; i <= cfg.count; i++) {
    const numStr = pad > 0 ? String(i).padStart(pad, "0") : String(i);
    const base = suffixFrom !== null && i >= suffixFrom ? numStr + suffix : numStr;

    let fileName;
    if (pattern) {
      const rank = i;      // 1-based
      const z = i - 1;     // 0-based

      fileName = pattern
        .replace(/{i3}/g, String(rank).padStart(3, "0"))
        .replace(/{i}/g, String(rank))
        .replace(/{z4}/g, String(z).padStart(4, "0"))
        .replace(/{z}/g, String(z))
        .replace(/{n}/g, String(rank));
    } else {
      fileName = namePrefix + base + nameSuffix;
    }

    let url = `${cfg.baseUrl}/${fileName}.${ext}`;

    // оверрайд для конкретных номеров
    if (cfg.overrides && cfg.overrides[i]) {
      url = cfg.overrides[i];
    }

    images.push({
      url,
      caption: `${label} — №${i}`,
    });
  }

  return images;
}

// ===== 3. ЛОГИКА ВЬЮЕРА =====

(function () {
  const imgEl = document.getElementById("mainImage");
  const counterEl = document.getElementById("counter");
  const captionEl = document.getElementById("caption");
  const headerLabelEl = document.getElementById("headerLabel");
  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const viewerEl = document.getElementById("viewer");

  const query = parseQuery();
  const gallery = getGallery(query.contest, query.year);

  if (!gallery || !gallery.length) {
    captionEl.textContent = "Галерея не найдена или пока не заполнена.";
    headerLabelEl.textContent = "Aquascape";
    imgEl.style.display = "none";
    btnPrev.style.display = "none";
    btnNext.style.display = "none";
    return;
  }

  const cfgContest = GALLERY_CONFIG[query.contest] || {};
  const cfgYear = cfgContest[query.year] || {};
  const headerLabel = cfgYear.label || (String(query.contest).toUpperCase() + " " + query.year);

  headerLabelEl.textContent = headerLabel;

  let currentIndex = Math.min(Math.max(query.idx || 0, 0), gallery.length - 1);

  // состояние зума/панорамирования
  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;
  let isPanning = false;
  let lastX = 0;
  let lastY = 0;

  let pinchStartDistance = 0;
  let pinchStartScale = 1;

  function applyTransform() {
    imgEl.style.transform = "translate(" + offsetX + "px, " + offsetY + "px) scale(" + scale + ")";
  }

  function resetTransform() {
    scale = 1;
    offsetX = 0;
    offsetY = 0;
    applyTransform();
  }

  function updateView() {
    const item = gallery[currentIndex];
    imgEl.src = item.url;
    captionEl.textContent = item.caption || "";
    counterEl.textContent = (currentIndex + 1) + " / " + gallery.length;
    resetTransform();
  }

  imgEl.onerror = function () {
    captionEl.textContent = "Не удалось загрузить изображение.";
  };

  btnPrev.addEventListener("click", function () {
    if (currentIndex > 0) {
      currentIndex -= 1;
      updateView();
    }
  });

  btnNext.addEventListener("click", function () {
    if (currentIndex < gallery.length - 1) {
      currentIndex += 1;
      updateView();
    }
  });

  // Панорамирование и зум на тач-устройствах
  viewerEl.addEventListener("touchstart", function (ev) {
    if (ev.touches.length === 1) {
      isPanning = true;
      lastX = ev.touches[0].clientX;
      lastY = ev.touches[0].clientY;
    } else if (ev.touches.length === 2) {
      isPanning = false;
      const dx = ev.touches[0].clientX - ev.touches[1].clientX;
      const dy = ev.touches[0].clientY - ev.touches[1].clientY;
      pinchStartDistance = Math.hypot(dx, dy);
      pinchStartScale = scale;
    }
  }, { passive: false });

  viewerEl.addEventListener("touchmove", function (ev) {
    if (ev.touches.length === 1 && isPanning && scale > 1) {
      ev.preventDefault();
      const x = ev.touches[0].clientX;
      const y = ev.touches[0].clientY;
      const dx = x - lastX;
      const dy = y - lastY;
      lastX = x;
      lastY = y;
      offsetX += dx;
      offsetY += dy;
      applyTransform();
    } else if (ev.touches.length === 2) {
      ev.preventDefault();
      const dx = ev.touches[0].clientX - ev.touches[1].clientX;
      const dy = ev.touches[0].clientY - ev.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      if (pinchStartDistance > 0) {
        let newScale = pinchStartScale * (dist / pinchStartDistance);
        if (newScale < 1) newScale = 1;
        if (newScale > 4) newScale = 4;
        scale = newScale;
        applyTransform();
      }
    }
  }, { passive: false });

  viewerEl.addEventListener("touchend", function (ev) {
    if (ev.touches && ev.touches.length === 0) {
      isPanning = false;
      pinchStartDistance = 0;
    }
  });

  viewerEl.addEventListener("dblclick", function () {
    resetTransform();
  });

  // стартовое отображение
  updateView();
})();

</script>
